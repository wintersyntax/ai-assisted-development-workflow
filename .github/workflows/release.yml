name: Workflow Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release input
        run: python scripts/validate_workflow.py

      - name: Build portable workflow bundle
        run: |
          mkdir -p dist
          tar -czf dist/ai-assisted-development-workflow.tar.gz             README.md LICENSE docs schemas examples scripts

      - name: Upload workflow bundle
        uses: actions/upload-artifact@v4
        with:
          name: ai-assisted-development-workflow
          path: dist/ai-assisted-development-workflow.tar.gz
